# Portable SRE Capsule — recommended for beta testers (Linux, macOS, Windows).
# Start: docker compose up -d --build
# UI: http://localhost:9000  (admin / admin)

services:
  srecapsule:
    build: .
    container_name: srecapsule-server
    ports:
      - "9000:9000"
    environment:
      APP_ENV: development
      # Required in production (or set in .env file).
      SRECAPSULE_JWT_SECRET: ${SRECAPSULE_JWT_SECRET:-dev-compose-change-me}
      SRECAPSULE_DATA_DIR: /app/data
      # MCP server auth token — sent by Cursor/agents in Authorization: Bearer header.
      # Leave empty in dev (no auth). Set a strong random secret in production.
      SRECAPSULE_MCP_TOKEN: ${SRECAPSULE_MCP_TOKEN:-}
      # GitHub token — required only for create_remediation_pr MCP tool.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SRE_VERIFY_RUNNER: http://test-runner:8091
      SRE_VERIFY_TOKEN: ${SRE_VERIFY_TOKEN:-dev-verify-change-me}
    depends_on:
      - test-runner
    volumes:
      - ./reports:/app/reports
      - ./plugins:/app/plugins
      - ./web:/app/web
      - ./tests:/app/tests
      - ./config.yaml:/app/config.yaml:ro
      # Named volume avoids host permission issues (root-owned ./data after a prior Docker run).
      - srecapsule_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  test-runner:
    build:
      context: .
      dockerfile: tests/runner/Dockerfile
    container_name: srecapsule-test-runner
    environment:
      TEST_ROOT: /work
      SRE_VERIFY_TOKEN: ${SRE_VERIFY_TOKEN:-dev-verify-change-me}
      CHROME_BIN: /usr/bin/chromium
      CHROMEDRIVER: /usr/bin/chromedriver
    volumes:
      - ./tests:/work/tests
    shm_size: "1gb"
    expose:
      - "8091"
    restart: unless-stopped

volumes:
  srecapsule_data:
